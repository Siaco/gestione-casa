# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "gestione-casa"
version = "0.1.0"
description = "Web app per la gestione casalinga: scadenze, spesa, faccende, manutenzioni, consumi, calendario e note"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "jinja2>=3.1",
    "babel>=2.16",
]

[project.scripts]
gestione-casa = "gestione_casa.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestione_casa"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = ["RUF001", "RUF002", "RUF003"]  # caratteri accentati nei testi italiani

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["babel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
